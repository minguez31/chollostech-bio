name: Chollos Tech 24/7 Cloud Automation & Bio Sync

on:
  schedule:
    # Rastreo 24/7 en la nube en dos frecuencias separadas para evitar colas y descartes de GitHub
    - cron: '15 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Publicar oferta fresca en Telegram automáticamente (true/false)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  cloud-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar ciclo de automatización en la nube
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL_ID: ${{ secrets.TELEGRAM_CANAL_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AWIN_PID: ${{ secrets.AWIN_PID }}
          INSTANT_GAMING_TAG: ${{ secrets.INSTANT_GAMING_TAG }}
          TRADEDOUBLER_SITE_ID: ${{ secrets.TRADEDOUBLER_SITE_ID }}
        run: |
          PUB_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.auto_publish }}" = "true" ]; then
            PUB_FLAG="--auto-publish"
          fi
          python actualizador_cloud.py $PUB_FLAG

      - name: Persistir cambios y actualizar GitHub Pages
        run: |
          git config --global user.name "ChollosTech Cloud Bot"
          git config --global user.email "bot@chollostech.cloud"
          git add index.html publicados_cloud.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cloud): sincronización automática continua de chollos y bio [skip ci]" && git push)
